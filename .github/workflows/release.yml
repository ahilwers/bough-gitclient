name: Release

# Build signed/notarized release artifacts for macOS, Windows and Linux and
# publish them to a GitHub Release when a version tag (v*.*.*) is pushed.
#
# Signing is OPTIONAL. Artifacts are always built. If the relevant secrets are
# not configured, that platform is simply built unsigned (macOS apps will then
# trigger the "unidentified developer" warning — see RELEASE.md).

on:
  push:
    tags:
      - "v*.*.*"
  # Allow manual triggering from the Actions tab (build/test without publishing a
  # real release). For these manual runs the publish job creates a DRAFT release.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Version is the tag name (e.g. v0.1.0) passed to the build via ldflags.
# BUILD_DATE uses the commit timestamp so it is shell-independent (works in bash AND PowerShell).
env:
  VERSION: ${{ github.ref_name }}
  BUILD_DATE: ${{ github.event.head_commit.timestamp || github.ref_name }}

jobs:
  # ────────────────────────────── Build matrix ────────────────────────────────
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # Mirror signing secrets into job-level env so they can be tested in `if:`
    # conditions (`secrets` is not an allowed context there).
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_APPLE_API: ${{ secrets.APPLE_API_KEY != '' && secrets.APPLE_TEAM_ID != '' }}
      HAS_WIN_CERT: ${{ secrets.SIGN_CERTIFICATE != '' }}
      HAS_SPARKLE_PUB: ${{ secrets.SPARKLE_PUBLIC_KEY != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Intel (x86_64)  — only remaining Intel label, valid until ~Aug 2027
          - label: macOS (Intel)
            os: macos-15-intel
            platform: darwin/amd64
            family: macos
            artifact: app/build/bin/Bough
            pkg_basename: Bough-${{ github.ref_name }}-macos-intel

          # macOS Apple Silicon (arm64) — macos-latest currently maps to macOS 26 (arm64)
          - label: macOS (Apple Silicon)
            os: macos-latest
            platform: darwin/arm64
            family: macos
            artifact: app/build/bin/Bough
            pkg_basename: Bough-${{ github.ref_name }}-macos-arm64

          # Windows x64 (NSIS installer)
          - label: Windows (x64)
            os: windows-latest
            platform: windows/amd64
            family: windows
            artifact: app/build/bin/Bough.exe
            pkg_basename: Bough-${{ github.ref_name }}-windows-x64

          # Linux x86_64 (AppImage)
          - label: Linux (x86_64)
            os: ubuntu-latest
            platform: linux/amd64
            family: linux
            artifact: app/build/bin/Bough
            pkg_basename: Bough-${{ github.ref_name }}-linux-x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: app/frontend

      # Wails needs GTK/WebKit dev libs to build the Linux binary.
      # ubuntu-24.04 (noble) only ships webkit2gtk 4.1, so we use the
      # `webkit2_41` Wails build tag (see -tags below).
      - name: Install Linux build dependencies
        if: matrix.family == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev libglib2.0-dev

      - name: Download Go dependencies
        run: go mod download
        working-directory: app

      # Inject the Sparkle EdDSA public key into Info.plist if provided.
      # Needed only for the macOS auto-update to verify cast signatures.
      - name: Set Sparkle public key
        if: matrix.family == 'macos' && env.HAS_SPARKLE_PUB == 'true'
        env:
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
        run: >-
          sed -i.bak
          "s|REPLACE_WITH_EDDSA_PUBLIC_KEY|$SPARKLE_PUBLIC_KEY|"
          app/build/darwin/Info.plist

      - name: Build (Wails)
        # Use bash explicitly: this step uses `\` line continuations, which break
        # on the default PowerShell shell used by the Windows runner (Git Bash is
        # available on all hosted runners).
        shell: bash
        run: |
          EXTRA=()
          # Generate the NSIS installer on Windows (Bough-amd64-installer.exe).
          if [ "${{ matrix.family }}" = "windows" ]; then EXTRA+=(-nsis); fi
          # Ubuntu 24.04 only has webkit2gtk 4.1: build with the webkit2_41 tag.
          if [ "${{ matrix.family }}" = "linux" ]; then EXTRA+=(-tags webkit2_41); fi
          go tool wails build \
            -clean \
            -platform ${{ matrix.platform }} \
            "${EXTRA[@]}" \
            -ldflags "-X main.version=${{ env.VERSION }} -X main.buildDate=${{ env.BUILD_DATE }}"
        working-directory: app

      # ── macOS: sign, package to DMG, notarize, staple ───────────────────────
      - name: Import Apple Developer certificate
        if: matrix.family == 'macos' && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p build build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p build build.keychain
          # Consent for codesign only — notarytool is resolved below via its real
          # Xcode path, so it is not pinned here.
          security import certificate.p12 \
            -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: -k build build.keychain

      - name: Code-sign & package macOS
        if: matrix.family == 'macos'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euxo pipefail
          cd app/build/bin
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            codesign --force --options runtime --timestamp \
              --sign "$APPLE_SIGNING_IDENTITY" Bough.app
          fi
          hdiutil create \
            -volname "Bough" \
            -srcfolder Bough.app \
            -ov -format UDZO \
            "${{ matrix.pkg_basename }}.dmg"
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            codesign --force --sign "$APPLE_SIGNING_IDENTITY" \
              "${{ matrix.pkg_basename }}.dmg"
          fi
          mv "${{ matrix.pkg_basename }}.dmg" ../../../

      - name: Notarize & staple macOS
        if: matrix.family == 'macos' && env.HAS_APPLE_API == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euxo pipefail
          echo "$APPLE_API_KEY" > authkey.p8
          xcrun notarytool submit \
            "${{ matrix.pkg_basename }}.dmg" \
            --key authkey.p8 \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 20m
          xcrun stapler staple "${{ matrix.pkg_basename }}.dmg"

      # ── Windows: sign NSIS installer ────────────────────────────────────────
      - name: Sign Windows installer
        if: matrix.family == 'windows' && env.HAS_WIN_CERT == 'true'
        env:
          SIGN_CERTIFICATE: ${{ secrets.SIGN_CERTIFICATE }}
          SIGN_PASSWORD: ${{ secrets.SIGN_PASSWORD }}
        shell: pwsh
        run: |
          # Locate signtool.exe (Windows SDK ships several; prefer the newest arch-agnostic one).
          $candidates = @(
            "$env:ProgramFiles(x86)\Windows Kits\10\bin\*\x64\signtool.exe",
            "$env:ProgramFiles(x86)\Windows Kits\10\bin\*\x86\signtool.exe"
          )
          $signtool = Get-ChildItem $candidates -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) {
            Write-Error "signtool.exe not found. Install Windows SDK first."
            exit 1
          }
          $b64 = "$env:SIGN_CERTIFICATE"
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($b64))
          & $signtool.FullName sign /f cert.pfx /p "$env:SIGN_PASSWORD" `
            /fd sha256 /tr http://timestamp.digicert.com /td sha256 `
            "app\build\bin\Bough-amd64-installer.exe"
          Remove-Item cert.pfx

      - name: Stage Windows artifact
        if: matrix.family == 'windows'
        run: |
          Copy-Item "app\build\bin\Bough-amd64-installer.exe" `
            "${{ matrix.pkg_basename }}.exe"
        shell: pwsh

      # ── Linux: build AppImage ───────────────────────────────────────────────
      - name: Build AppImage
        if: matrix.family == 'linux'
        run: |
          appimagetool="appimagetool-x86_64.AppImage"
          curl -LfsS -o "$appimagetool" \
            https://github.com/AppImage/appimagetool/releases/latest/download/$appimagetool
          chmod +x "$appimagetool"
          mkdir -p appimagetool_mount && ./"$appimagetool" --appimage-extract &>/dev/null
          export PATH="$PWD/squashfs-root/usr/bin:$PATH"
          bash scripts/build_appimage.sh "${{ env.VERSION }}" app/build/bin/Bough
          rm -rf squashfs-root appimagetool_mount "$appimagetool"
          cp Bough-${{ env.VERSION }}-linux-x86_64.AppImage \
            "${{ matrix.pkg_basename }}.AppImage"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          if-no-files-found: error
          path: |
            ${{ matrix.pkg_basename }}.*
            !*.app

  # ────────────────────────── Publish GitHub Release ─────────────────────────
  publish:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifact files
        run: |
          set -e
          mkdir -p release
          find dist -type f ! -name '*.app' -exec cp {} release/ \;

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # Manual (workflow_dispatch) runs create a DRAFT release so they can be
          # checked before anything is published. Tag runs publish for real.
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ────────────────────── Appcast (optional auto-update) ──────────────────────
  # Generates the Sparkle appcast.xml and publishes it to the gh-pages branch,
  # which hosting the XML at updates.bough.app enables. Optional: steps are
  # skipped when SPARKLE_PRIVATE_KEY is not configured. Failing here never
  # blocks the release.
  appcast:
    name: Generate Appcast
    needs: publish
    runs-on: ubuntu-latest
    env:
      HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate appcast
        if: env.HAS_SPARKLE_KEY == 'true'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: bash scripts/generate_appcast.sh "${{ env.VERSION }}"

      - name: Deploy appcast to gh-pages
        if: env.HAS_SPARKLE_KEY == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./appcast
          publish_branch: gh-pages
          enable_jekyll: true