name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # ── Build + sign on each platform ──────────────────────────────────────────
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13          # Intel runner
            target: darwin/amd64
            artifact_name: Bough-${{ github.ref_name }}-macos-intel.dmg
            wails_platform: darwin/amd64

          - os: macos-latest      # Apple Silicon runner (M-series)
            target: darwin/arm64
            artifact_name: Bough-${{ github.ref_name }}-macos-arm64.dmg
            wails_platform: darwin/arm64

          - os: windows-latest
            target: windows/amd64
            artifact_name: Bough-${{ github.ref_name }}-windows-x64.exe
            wails_platform: windows/amd64

          - os: ubuntu-latest
            target: linux/amd64
            artifact_name: Bough-${{ github.ref_name }}-linux-x86_64.AppImage
            wails_platform: linux/amd64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      - name: Download Go dependencies
        run: go mod download
        working-directory: app

      # ── Platform dependencies ─────────────────────────────────────────────
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install create-dmg

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            appimagetool \
            fuse \
            libfuse2

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build Wails app (macOS — with Sparkle CGo)
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: '1'
        run: |
          go tool wails build \
            -platform ${{ matrix.wails_platform }} \
            -tags sparkle \
            -ldflags "-X main.version=${{ github.ref_name }} -X main.buildDate=$(date -u +%Y-%m-%d)"
        working-directory: app

      - name: Build Wails app (Windows / Linux)
        if: runner.os != 'macOS'
        env:
          CGO_ENABLED: '1'
        run: |
          go tool wails build \
            -platform ${{ matrix.wails_platform }} \
            -ldflags "-X main.version=${{ github.ref_name }} -X main.buildDate=$(date -u +%Y-%m-%d)"
        working-directory: app

      # ── macOS: package as DMG ─────────────────────────────────────────────
      - name: Create DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          create-dmg \
            --volname "Bough ${{ github.ref_name }}" \
            --window-size 540 380 \
            --icon-size 100 \
            --icon "Bough.app" 140 185 \
            --hide-extension "Bough.app" \
            --app-drop-link 400 185 \
            "app/build/bin/${{ matrix.artifact_name }}" \
            "app/build/bin/Bough.app"

      # ── macOS: code sign ──────────────────────────────────────────────────
      - name: Code sign (macOS)
        if: runner.os == 'macOS' && env.APPLE_SIGNING_KEY != ''
        env:
          APPLE_SIGNING_KEY: ${{ secrets.APPLE_SIGNING_KEY }}
          APPLE_SIGNING_KEY_PASSWORD: ${{ secrets.APPLE_SIGNING_KEY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Import certificate
          echo "$APPLE_SIGNING_KEY" | base64 --decode -o /tmp/cert.p12
          security create-keychain -p "" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$APPLE_SIGNING_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          security list-keychains -d user -s build.keychain
          rm /tmp/cert.p12

          # Sign app bundle
          codesign \
            --deep --force --options runtime \
            --sign "Developer ID Application: $APPLE_TEAM_ID" \
            "app/build/bin/Bough.app"

          # Re-create DMG after signing
          create-dmg \
            --volname "Bough ${{ github.ref_name }}" \
            --window-size 540 380 \
            --icon-size 100 \
            --icon "Bough.app" 140 185 \
            --hide-extension "Bough.app" \
            --app-drop-link 400 185 \
            "app/build/bin/${{ matrix.artifact_name }}" \
            "app/build/bin/Bough.app"

      # ── macOS: notarize ───────────────────────────────────────────────────
      - name: Notarize (macOS)
        if: runner.os == 'macOS' && env.NOTARY_USER != ''
        env:
          NOTARY_USER: ${{ secrets.NOTARY_USER }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "app/build/bin/${{ matrix.artifact_name }}" \
            --apple-id "$NOTARY_USER" \
            --password "$NOTARY_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "app/build/bin/Bough.app"

      # ── Windows: sign with Authenticode ──────────────────────────────────
      - name: Sign executable (Windows)
        if: runner.os == 'Windows' && env.WIN_CERT != ''
        env:
          WIN_CERT: ${{ secrets.WIN_CERT }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $certBytes = [Convert]::FromBase64String($env:WIN_CERT)
          [IO.File]::WriteAllBytes("cert.pfx", $certBytes)
          & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe" `
            sign /f cert.pfx /p $env:WIN_CERT_PASSWORD `
            /fd sha256 /tr http://timestamp.digicert.com /td sha256 `
            "app\build\bin\${{ matrix.artifact_name }}"
          Remove-Item cert.pfx

      # ── Linux: package as AppImage ────────────────────────────────────────
      - name: Build AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          bash scripts/build_appimage.sh "${{ github.ref_name }}" "app/build/bin/Bough"
          mv "Bough-${{ github.ref_name }}-linux-x86_64.AppImage" \
             "app/build/bin/${{ matrix.artifact_name }}"

      # ── Sign artifact (macOS only — for Sparkle EdDSA) ───────────────────
      - name: Sign artifact for Sparkle (macOS)
        if: runner.os == 'macOS'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          SIGNATURE=$(bash scripts/sign_update.sh "app/build/bin/${{ matrix.artifact_name }}")
          echo "SPARKLE_SIGNATURE=$SIGNATURE" >> "$GITHUB_ENV"

      # ── Upload artifact to the GitHub Release ─────────────────────────────
      - name: Upload release artifact
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/bin/${{ matrix.artifact_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  # ── Generate + deploy appcast ───────────────────────────────────────────────
  appcast:
    name: Generate appcast
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate appcast.xml
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: bash scripts/generate_appcast.sh "${{ github.ref_name }}"

      - name: Deploy appcast to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./appcast
          destination_dir: .
          keep_files: false
          cname: updates.bough.app
