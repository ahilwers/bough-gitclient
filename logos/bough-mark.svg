<svg width="52" height="52" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bough">
  <defs>
    <linearGradient id="bough-grad" x1="0" y1="0" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <!-- trunk -->
  <line x1="26" y1="44" x2="26" y2="26" stroke="url(#bough-grad)" stroke-width="2.8" stroke-linecap="round"/>
  <!-- main branches -->
  <path d="M26 26 Q26 14 14 14" stroke="url(#bough-grad)" stroke-width="2.8" stroke-linecap="round" fill="none"/>
  <path d="M26 26 Q26 14 38 14" stroke="url(#bough-grad)" stroke-width="2.8" stroke-linecap="round" fill="none"/>
  <!-- sub-branches -->
  <path d="M14 14 Q14 8 8 8"   stroke="url(#bough-grad)" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.75"/>
  <path d="M14 14 Q14 8 20 8"  stroke="url(#bough-grad)" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.75"/>
  <path d="M38 14 Q38 8 44 8"  stroke="url(#bough-grad)" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.75"/>
  <!-- nodes -->
  <circle cx="26" cy="26" r="3.2" fill="url(#bough-grad)"/>
  <circle cx="14" cy="14" r="3.2" fill="url(#bough-grad)"/>
  <circle cx="38" cy="14" r="3.2" fill="url(#bough-grad)"/>
  <circle cx="8"  cy="8"  r="2.2" fill="url(#bough-grad)" opacity="0.8"/>
  <circle cx="20" cy="8"  r="2.2" fill="url(#bough-grad)" opacity="0.8"/>
  <circle cx="44" cy="8"  r="2.2" fill="url(#bough-grad)" opacity="0.8"/>
  <circle cx="26" cy="44" r="2.8" fill="url(#bough-grad)" opacity="0.45"/>
</svg>
