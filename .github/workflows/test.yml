name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go-tests:
    name: Go Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Download Go dependencies
        run: go mod download
        working-directory: app

      - name: Test app backend
        run: go test -race -cover ./git/...
        working-directory: app

  app-tests:
    name: Wails App Tests and Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Download Go dependencies
        run: go mod download
        working-directory: app

      # Go tests need embedded assets before the full Wails build below.
      - name: Prepare embedded assets
        run: mkdir -p frontend/dist && touch frontend/dist/.placeholder
        working-directory: app

      - name: Test app bindings
        run: go test -race -cover .
        working-directory: app

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: app/frontend

      - name: Build wails3 CLI tool
        run: go build -o "$(go env GOPATH)/bin/wails3" github.com/wailsapp/wails/v3/cmd/wails3
        working-directory: app

      - name: Build Wails app with generated bindings
        # Remove the placeholder dist so the v3 Taskfile cache rebuilds the real
        # frontend bundle (its `generates` check would otherwise treat the
        # Go-test placeholder as up to date).
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          rm -rf frontend/dist
          wails3 build
        working-directory: app

  frontend-tests:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: app/frontend

      - name: Run unit + component tests
        run: npm test
        working-directory: app/frontend

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: app/frontend/coverage/
