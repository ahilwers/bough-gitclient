<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bough – Logo Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #111; }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 100vh;
  }

  /* ── Dark panel ───────────────────────────────────────── */
  .panel-dark {
    background: #0d0d0f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 48px;
    padding: 48px;
    border-right: 1px solid #222;
  }

  /* ── Light panel ──────────────────────────────────────── */
  .panel-light {
    background: #f5f5f5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 48px;
    padding: 48px;
  }

  .label {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 500;
    margin-bottom: -36px;
  }
  .panel-dark .label { color: #555; }
  .panel-light .label { color: #aaa; }

  .logo-wrap {
    display: flex;
    align-items: center;
    gap: 0;
  }

  /* ─── sizes ──────────────────────────────────────── */
  .size-lg  .logo-wrap { transform: scale(1);   }
  .size-md  .logo-wrap { transform: scale(0.55); transform-origin: center; }
  .size-sm  .logo-wrap { transform: scale(0.28); transform-origin: center; }

  .size-lg  { height: 200px; display:flex; align-items:center; justify-content:center; }
  .size-md  { height: 110px; display:flex; align-items:center; justify-content:center; }
  .size-sm  { height: 60px;  display:flex; align-items:center; justify-content:center; }

  /* icon only */
  .icon-only {
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
</style>
</head>
