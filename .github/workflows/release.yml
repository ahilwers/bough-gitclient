name: Release

# Build signed/notarized release artifacts for macOS, Windows and Linux and
# publish them to a GitHub Release when a version tag (v*.*.*) is pushed.
#
# Signing is OPTIONAL. Artifacts are always built. If the relevant secrets are
# not configured, that platform is simply built unsigned (macOS apps will then
# trigger the "unidentified developer" warning — see RELEASE.md).

on:
  push:
    tags:
      - "v*.*.*"
  # Allow manual triggering from the Actions tab (build/test without publishing a
  # real release). To also create a DRAFT release, pass a tag name via the `tag`
  # input; without one, publishing is skipped.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create a DRAFT release for (e.g. v0.1.0); leave empty to only build artifacts"
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Version is the tag name (e.g. v0.1.0) passed to the build via VERSION=...; the
# platform Taskfiles turn it into -X main.version so every build path that
# rebuilds the binary (including packaging) stamps the same value.
env:
  VERSION: ${{ github.ref_name }}

jobs:
  # ────────────────────────────── Build matrix ────────────────────────────────
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # Mirror signing secrets into job-level env so they can be tested in `if:`
    # conditions (`secrets` is not an allowed context there).
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_APPLE_API: ${{ secrets.APPLE_API_KEY != '' && secrets.APPLE_TEAM_ID != '' }}
      HAS_WIN_CERT: ${{ secrets.SIGN_CERTIFICATE != '' }}
      HAS_SPARKLE_PUB: ${{ secrets.SPARKLE_PUBLIC_KEY != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Intel (x86_64)  — only remaining Intel label, valid until ~Aug 2027
          - label: macOS (Intel)
            os: macos-15-intel
            family: macos
            goos: darwin
            goarch: amd64
            artifact: app/bin/GitMorrow.app
            pkg_basename: GitMorrow-${{ github.ref_name }}-macos-intel

          # macOS Apple Silicon (arm64) — macos-latest currently maps to macOS 26 (arm64)
          - label: macOS (Apple Silicon)
            os: macos-latest
            family: macos
            goos: darwin
            goarch: arm64
            artifact: app/bin/GitMorrow.app
            pkg_basename: GitMorrow-${{ github.ref_name }}-macos-arm64

          # Windows x64 (NSIS installer)
          - label: Windows (x64)
            os: windows-latest
            family: windows
            goos: windows
            goarch: amd64
            artifact: app/bin/GitMorrow-amd64-installer.exe
            pkg_basename: GitMorrow-${{ github.ref_name }}-windows-x64

          # Linux x86_64 (AppImage)
          - label: Linux (x86_64)
            os: ubuntu-latest
            family: linux
            goos: linux
            goarch: amd64
            artifact: app/bin/gitmorrow-x86_64.AppImage
            pkg_basename: GitMorrow-${{ github.ref_name }}-linux-x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: app/frontend

      # Wails v3 on Linux builds against GTK4 / WebKitGTK 6.0 (the v2-era
      # webkit2_41 tag no longer exists). Both the CLI and the app need the
      # same pkg-config files, so install them before anything is compiled.
      - name: Install Linux build dependencies
        if: matrix.family == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev \
            libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev libglib2.0-dev

      # Wails builds the NSIS installer with makensis, which is not preinstalled
      # on GitHub Windows runners.
      - name: Install NSIS (Windows)
        if: matrix.family == 'windows'
        run: choco install nsis -y --no-progress
        shell: pwsh

      - name: Download Go dependencies
        run: go mod download
        working-directory: app

      - name: Build wails3 CLI tool
        # GOEXE appends .exe on Windows; without it the Taskfiles cannot find
        # the CLI (`exec: "wails3": executable file not found in $PATH`).
        run: go build -o "$(go env GOPATH)/bin/wails3$(go env GOEXE)" github.com/wailsapp/wails/v3/cmd/wails3
        working-directory: app

      # Inject the Sparkle EdDSA public key into Info.plist if provided.
      # Needed only for the macOS auto-update to verify cast signatures.
      - name: Set Sparkle public key
        if: matrix.family == 'macos' && env.HAS_SPARKLE_PUB == 'true'
        env:
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
        run: >-
          sed -i.bak
          "s|REPLACE_WITH_EDDSA_PUBLIC_KEY|$SPARKLE_PUBLIC_KEY|"
          app/build/darwin/Info.plist

      - name: Build (Wails)
        # Use bash explicitly: this step uses `\` line continuations, which break
        # on the default PowerShell shell used by the Windows runner (Git Bash is
        # available on all hosted runners).
        shell: bash
        run: |
          # wails3 is built into $(go env GOPATH)/bin by the step above.
          export PATH="$(go env GOPATH)/bin:$PATH"
          # macOS ships the Liquid Glass backdrop, which needs Wails' private
          # WebKit API for webview transparency (not App Store compatible).
          case "${{ matrix.family }}" in
            macos) EXTRA_TAGS=liquidglass,private_mac_apis ;;
            *)     EXTRA_TAGS="" ;;
          esac
          wails3 build \
            GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            EXTRA_TAGS="$EXTRA_TAGS" \
            VERSION="${{ env.VERSION }}"
        working-directory: app

      - name: Package (Wails)
        shell: bash
        run: |
          # Build the per-platform distributable with the v3 Taskfiles. The
          # wails3 CLI binary is built into $(go env GOPATH)/bin above.
          export PATH="$(go env GOPATH)/bin:$PATH"
          case "${{ matrix.family }}" in
            macos)
              # Package rebuilds via the `build` dep, so it needs the same tags.
              wails3 task darwin:package GOOS=darwin ARCH=${{ matrix.goarch }} VERSION="${{ env.VERSION }}" EXTRA_TAGS=liquidglass,private_mac_apis
              ;;
            windows)
              # The choco-deployed NSIS is usually not on the runner PATH;
              # locate makensis and prepend its directory.
              MAKENSIS_DIR="$(dirname "$(command -v makensis || echo '/c/Program Files (x86)/NSIS/makensis.exe')")"
              export PATH="$MAKENSIS_DIR:$PATH"
              # VERSION is required here: packaging rebuilds the .exe, and without
              # it the shipped binary falls back to "dev" and About shows
              # "Development build".
              wails3 task windows:package GOOS=windows ARCH=${{ matrix.goarch }} FORMAT=nsis VERSION="${{ env.VERSION }}"
              ;;
            linux)
              # Only the AppImage is shipped; skip the deb/rpm/aur wrappers.
              wails3 task linux:create:appimage GOOS=linux ARCH=${{ matrix.goarch }} VERSION="${{ env.VERSION }}"
              ;;
          esac
        working-directory: app

      # ── macOS: sign, package to DMG, notarize, staple ───────────────────────
      - name: Import Apple Developer certificate
        if: matrix.family == 'macos' && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p build build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p build build.keychain
          # Consent for codesign only — notarytool is resolved below via its real
          # Xcode path, so it is not pinned here.
          security import certificate.p12 \
            -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: -k build build.keychain

      - name: Code-sign & package macOS
        if: matrix.family == 'macos'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euxo pipefail
          cd app/bin
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            codesign --force --options runtime --timestamp \
              --sign "$APPLE_SIGNING_IDENTITY" GitMorrow.app
          fi
          hdiutil create \
            -volname "GitMorrow" \
            -srcfolder GitMorrow.app \
            -ov -format UDZO \
            "${{ matrix.pkg_basename }}.dmg"
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            codesign --force --sign "$APPLE_SIGNING_IDENTITY" \
              "${{ matrix.pkg_basename }}.dmg"
          fi
          mv "${{ matrix.pkg_basename }}.dmg" ../../

      - name: Notarize & staple macOS
        if: matrix.family == 'macos' && env.HAS_APPLE_API == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euxo pipefail
          DMG="${{ matrix.pkg_basename }}.dmg"
          echo "$APPLE_API_KEY" > authkey.p8
          xcrun notarytool submit "$DMG" \
            --key authkey.p8 \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 20m
          # Stapling downloads the ticket from Apple's CloudKit, which
          # intermittently drops the connection (NSURLErrorDomain -1005 ->
          # "stapler ... failed! Error 68"). That says nothing about the build,
          # so retry instead of failing the release.
          for attempt in 1 2 3 4 5; do
            if xcrun stapler staple "$DMG"; then
              # `stapler validate` also asks Apple's CloudKit and fails with
              # error 68 on the same flaky connection, even when the ticket was
              # attached. The staple above is what matters, so do not block.
              xcrun stapler validate "$DMG" ||
                echo "::warning::stapler validate could not reach Apple; the ticket is attached"
              exit 0
            fi
            echo "::warning::stapler attempt $attempt failed, retrying in 20s"
            sleep 20
          done
          # Notarization was accepted above, so online installations are fine.
          # Only the first launch without network access can warn without a
          # stapled ticket, which is not worth blocking the release over.
          echo "::warning::Could not staple $DMG; publishing the notarized DMG without an attached ticket"

      # ── Windows: sign NSIS installer ────────────────────────────────────────
      - name: Sign Windows installer
        if: matrix.family == 'windows' && env.HAS_WIN_CERT == 'true'
        env:
          SIGN_CERTIFICATE: ${{ secrets.SIGN_CERTIFICATE }}
          SIGN_PASSWORD: ${{ secrets.SIGN_PASSWORD }}
        shell: pwsh
        run: |
          # Locate signtool.exe (Windows SDK ships several; prefer the newest arch-agnostic one).
          $candidates = @(
            "$env:ProgramFiles(x86)\Windows Kits\10\bin\*\x64\signtool.exe",
            "$env:ProgramFiles(x86)\Windows Kits\10\bin\*\x86\signtool.exe"
          )
          $signtool = Get-ChildItem $candidates -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) {
            Write-Error "signtool.exe not found. Install Windows SDK first."
            exit 1
          }
          $b64 = "$env:SIGN_CERTIFICATE"
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($b64))
          & $signtool.FullName sign /f cert.pfx /p "$env:SIGN_PASSWORD" `
            /fd sha256 /tr http://timestamp.digicert.com /td sha256 `
            "app\bin\GitMorrow-amd64-installer.exe"
          Remove-Item cert.pfx

      - name: Stage Windows artifact
        if: matrix.family == 'windows'
        run: |
          Copy-Item "app\bin\GitMorrow-amd64-installer.exe" `
            "${{ matrix.pkg_basename }}.exe"
        shell: pwsh

      - name: Stage Linux artifact
        if: matrix.family == 'linux'
        shell: bash
        run: |
          # `wails3 generate appimage` lowercases the binary name, so the file
          # is gitmorrow-x86_64.AppImage even though APP_NAME is "GitMorrow".
          mv app/bin/*-x86_64.AppImage "${{ matrix.pkg_basename }}.AppImage"

      # AppImage, .app bundle and .exe installer are produced by the Wails
      # v3 `Package` task above (app/bin/*).

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          if-no-files-found: error
          path: |
            ${{ matrix.pkg_basename }}.*
            !*.app

  # ────────────────────────── Publish GitHub Release ─────────────────────────
  publish:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifact files
        run: |
          set -e
          mkdir -p release
          find dist -type f ! -name '*.app' -exec cp {} release/ \;

      - name: Publish release
        if: >
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
        uses: softprops/action-gh-release@v2
        with:
          # Tag runs publish for real; manual runs that supply a tag create a DRAFT
          # release so they can be checked before anything is published.
          tag_name: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ────────────────────── Appcast (optional auto-update) ──────────────────────
  # Generates the Sparkle appcast.xml and publishes it to the gh-pages branch,
  # which hosting the XML at updates.gitmorrow.app enables. Optional: steps are
  # skipped when SPARKLE_PRIVATE_KEY is not configured. Failing here never
  # blocks the release.
  appcast:
    name: Generate Appcast
    needs: publish
    runs-on: ubuntu-latest
    env:
      HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate appcast
        if: env.HAS_SPARKLE_KEY == 'true'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: bash scripts/generate_appcast.sh "${{ env.VERSION }}"

      - name: Deploy appcast to gh-pages
        if: env.HAS_SPARKLE_KEY == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./appcast
          publish_branch: gh-pages
          enable_jekyll: true